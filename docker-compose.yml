services:
  postgres:
    image: postgres:17
    container_name: volontweet-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-volontweet}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - volontweet_dev

  pgadmin:
    image: dpage/pgadmin4
    container_name: volontweet-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - volontweet_dev

  neo4j:
    image: neo4j:latest
    container_name: volontweet-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/neo4jpassword}
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/var/lib/neo4j/logs
    networks:
      - volontweet_dev

volumes:
  pgadmin_data:
  postgres_data:
  neo4j_data:
  neo4j_logs:

networks:
  volontweet_dev:
    driver: bridge
