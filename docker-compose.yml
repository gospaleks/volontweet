services:
  postgres:
    image: postgres:17
    container_name: volontweet-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-volontweet}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - volontweet_dev

  pgadmin:
    image: dpage/pgadmin4
    container_name: volontweet-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    networks:
      - volontweet_dev

volumes:
  postgres_data:

networks:
  volontweet_dev:
    driver: bridge
